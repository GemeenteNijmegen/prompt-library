[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "prompt-gallery"
version = "0.1.0"
description = "Standalone Prompt Gallery REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cachetools>=5.3",
    "aiofiles>=23.2",
    "mcp[cli]>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "gallery_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: live-stack integration tests (require KEYCLOAK_URL and GALLERY_API_URL)",
]
filterwarnings = [
    # Starlette's TestClient warns that httpx support is deprecated in favour of
    # an unreleased `httpx2`. There is nothing to migrate to yet and httpx is a
    # transitive dependency we don't control here, so silence this one warning.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*"]
