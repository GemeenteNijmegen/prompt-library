name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gallery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations (Postgres)
        run: alembic upgrade head && alembic downgrade base
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/gallery_test

      - name: Run migrations (SQLite)
        run: |
          alembic upgrade head
          alembic downgrade base
        env:
          DATABASE_URL: sqlite:////tmp/gallery_ci.db

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: ci-secret
          EMBEDDING_USE_FAKE: "true"
