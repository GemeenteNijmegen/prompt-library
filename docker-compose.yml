# Profiles:
#   full       – Postgres 18 + Redis 7 + app + mcp, built images  [default]
#   dev        – same infrastructure + src volumes + --reload + mcp-dev
#   simple     – app only, SQLite, no external services
#   embeddings – full stack using app-with-embeddings image (real ML model bundled)
#   keycloak   – local Keycloak v26 (RS256 OIDC); combine with dev for full local SSO
#
# Usage:
#   docker compose up                                       # full stack  (COMPOSE_PROFILES=full set in .env)
#   docker compose --profile dev up                        # hot-reload + mcp-dev
#   docker compose --profile dev --profile keycloak up     # hot-reload + local Keycloak
#   docker compose --profile simple up                     # SQLite, single container
#   docker compose --profile embeddings up                 # bundled model, real semantic search

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    profiles: [full, dev, embeddings]
    image: postgres:18
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    profiles: [full, dev, embeddings]
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── App: full stack (built image) ──────────────────────────────────────────

  app:
    profiles: [full]
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://gallery:gallery@postgres:5432/gallery
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Keycloak (local OIDC / RS256) ─────────────────────────────────────────

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.6.2
    # start-dev + post-boot kcadm patch: bash /dev/tcp waits for port 8080 without
    # curl, then retries kcadm.sh (bundled Java CLI, no curl needed) until the admin
    # API is ready, then sets sslRequired=NONE so the admin console works over HTTP.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/keycloak/bin/kc.sh start-dev --import-realm &
        kc_pid=$$!
        until (echo >/dev/tcp/127.0.0.1/8080) 2>/dev/null; do sleep 2; done
        until /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://127.0.0.1:8080 --realm master \
          --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" \
          --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD" 2>/dev/null; \
        do sleep 2; done
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE
        # Wire Organisation membership. IDs are hard-coded to match the fixed UUIDs
        # in keycloak/realm-export.json — change both together or membership breaks.
        #   org-a  = 00000000-0000-0001-0000-000000000001  (alice)
        #   org-b  = 00000000-0000-0001-0000-000000000002  (bob, carol)
        ORG_A=00000000-0000-0001-0000-000000000001
        ORG_B=00000000-0000-0001-0000-000000000002
        ALICE=00000000-0000-0000-0000-000000000001
        BOB=00000000-0000-0000-0000-000000000002
        CAROL=00000000-0000-0000-0000-000000000003
        /opt/keycloak/bin/kcadm.sh update "organizations/$$ORG_A/members/$$ALICE" -r gallery || true
        /opt/keycloak/bin/kcadm.sh update "organizations/$$ORG_B/members/$$BOB"   -r gallery || true
        /opt/keycloak/bin/kcadm.sh update "organizations/$$ORG_B/members/$$CAROL" -r gallery || true
        # Wait for the gallery realm to finish importing so service accounts exist.
        # The master-realm kcadm.sh auth succeeds before --import-realm completes,
        # so gallery-realm SA users might not exist yet without this wait.
        until /opt/keycloak/bin/kcadm.sh get users -r gallery \
          -q username=service-account-gallery-test-client 2>/dev/null \
          | grep -q "service-account-gallery-test-client"; do sleep 2; done
        # Grant prompt roles to org-deploy-example's service account.
        # realm-export.json user entries for auto-created SAs may be skipped on
        # first import; kcadm.sh is the reliable fallback.
        /opt/keycloak/bin/kcadm.sh add-roles -r gallery \
          --uusername service-account-org-deploy-example \
          --rolename prompt:read \
          --rolename prompt:create \
          --rolename prompt:write \
          --rolename prompt:publish \
          --rolename prompt:rate \
          --rolename prompt:image \
          --rolename apikey:create || true
        # Grant realm-management client roles to gallery-test-client's SA.
        # Same skip problem for clientRoles in user entries; kcadm.sh is the fix.
        /opt/keycloak/bin/kcadm.sh add-roles -r gallery \
          --uusername service-account-gallery-test-client \
          --cclientid realm-management \
          --rolename manage-users || true
        /opt/keycloak/bin/kcadm.sh add-roles -r gallery \
          --uusername service-account-gallery-test-client \
          --cclientid realm-management \
          --rolename view-users || true
        wait $$kc_pid
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # KC_DB=dev-mem is the image default for start-dev; no need to set it here.
      # Pin the canonical hostname so tokens always carry
      # iss=http://localhost:8080/realms/gallery regardless of whether Keycloak is
      # reached via the Docker-internal name (keycloak:8080) or the host-side name
      # (localhost:8080).  Without this, start-dev derives the issuer from the
      # request URL, so a token fetched externally (iss=localhost:8080) fails the
      # gallery's strict iss check when JWKS is fetched via keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      # start-dev keeps hostname-strict off, so backchannel access (the kcadm
      # bootstrap below via 127.0.0.1, the app's JWKS fetch via keycloak:8080)
      # still works — only the issuer/frontend URL is pinned to localhost:8080.
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "(echo >/dev/tcp/localhost/8080) 2>/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── App: dev (src volume + hot-reload) ─────────────────────────────────────

  app-dev:
    profiles: [dev]
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://gallery:gallery@postgres:5432/gallery
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      LOG_LEVEL: debug
      EMBEDDING_USE_FAKE: "true"
      # Keycloak integration — values mirror keycloak/realm-export.json.
      # KEYCLOAK_URL uses the compose-internal hostname; JWT_ISSUER uses the
      # external URL that Keycloak embeds in tokens (iss claim).
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: gallery
      # Admin client used only for logout-everywhere (terminating interactive
      # SSO sessions). API keys are opaque gallery secrets — no Keycloak client
      # is involved in issuing them.
      KEYCLOAK_ADMIN_CLIENT_ID: gallery-test-client
      KEYCLOAK_ADMIN_CLIENT_SECRET: test-client-secret
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
        required: false

  # ── App: simple (SQLite, no external services) ─────────────────────────────

  app-simple:
    profiles: [simple]
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:///data/gallery.db
      REDIS_URL: ""
    volumes:
      - ./data:/app/data

  # ── App: embeddings (bundled ML model for real semantic search) ────────────

  app-embeddings:
    profiles: [embeddings]
    build:
      context: .
      target: app-with-embeddings
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://gallery:gallery@postgres:5432/gallery
      REDIS_URL: redis://redis:6379
      EMBEDDING_USE_FAKE: "false"
      FASTEMBED_CACHE_PATH: /cache/fastembed
    volumes:
      - fastembed_cache:/cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── MCP sidecar: full stack (token-forwarding, crypto-free, ADR 0005) ────────

  mcp:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "${MCP_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      GALLERY_API_URL: http://app:8000
      MCP_RESOURCE_URL: "${MCP_RESOURCE_URL:-http://localhost:8001}"
      KEYCLOAK_REALM_URL: "${KEYCLOAK_REALM_URL:-http://localhost:8080/realms/gallery}"
    depends_on:
      app:
        condition: service_started

  # ── MCP sidecar: dev (gallery_mcp volume for live edits) ─────────────────

  mcp-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "${MCP_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      GALLERY_API_URL: http://app-dev:8000
      MCP_RESOURCE_URL: "${MCP_RESOURCE_URL:-http://localhost:8001}"
      KEYCLOAK_REALM_URL: "${KEYCLOAK_REALM_URL:-http://localhost:8080/realms/gallery}"
    volumes:
      - ./gallery_mcp:/app/gallery_mcp
    depends_on:
      app-dev:
        condition: service_started

volumes:
  postgres_data:
  fastembed_cache:
